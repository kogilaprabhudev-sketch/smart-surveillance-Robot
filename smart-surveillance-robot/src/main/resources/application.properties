spring.application.name=smart-surveillance-robot
server.port=8080

# ---------- MySQL (override with environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/surveillance_robot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# ---------- Robot behaviour (values come from the project report) ----------
# Shared secret the Raspberry Pi sends in the X-API-KEY header
robot.api-key=${ROBOT_API_KEY:change-this-robot-key}
robot.default-robot-code=SPSR-01
# Robot is marked OFFLINE if it sends nothing for this long
robot.heartbeat-timeout-seconds=60
# Ultrasonic distance below which a "Low Distance" alert is raised (cm)
robot.distance-alert-cm=5
# Minimum YOLO confidence for a detection to count as valid
robot.confidence-threshold=0.50
# Predefined target classes that trigger an alert (comma separated)
robot.target-classes=person
# Do not repeat the same alert type for the same robot more often than this
robot.alert-cooldown-seconds=30

# ---------- Telegram (leave empty to disable) ----------
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.polling-enabled=true

# ---------- Dashboard users created on first start ----------
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.operator.username=${OPERATOR_USERNAME:operator}
app.operator.password=${OPERATOR_PASSWORD:Operator@123}
spring.data.web.pageable.max-page-size=100
